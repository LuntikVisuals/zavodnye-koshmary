name: Publish release (one-time bootstrap)

# The GitHub API tools used to maintain this repo can only upload text files,
# so the signed APK (built and signed locally) is uploaded as base64 into .github/bootstrap/
# (since v3.5 split into parts zavodnye-koshmary.apk.b64.partN; the .sha256 file is uploaded last).
# Since v3.8 the voice clips (voice/*.ogg) come as .github/bootstrap/voice.tar.gz.b64 and are committed to voice/ for the web version.
# This workflow decodes it, verifies SHA-256, creates the release with the APK,
# removes the payload and syncs gh-pages with main.
# It does NOT build or sign anything. v1.0 - v3.5 were published the same way.

on:
  push:
    branches: [main]
    paths: ['.github/bootstrap/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify payload
        run: |
          set -euo pipefail
          ls .github/bootstrap/zavodnye-koshmary.apk.b64.part* >/dev/null 2>&1 || { printf 'payload already processed\n'; exit 0; }
          test -f .github/bootstrap/zavodnye-koshmary.apk.sha256 || { printf 'checksum file not uploaded yet\n'; exit 0; }
          mkdir -p /tmp/p
          ls -l .github/bootstrap
          cat $(ls .github/bootstrap/zavodnye-koshmary.apk.b64.part* | sort -V) | base64 -d > /tmp/p/zavodnye-koshmary.apk
          printf '%s  /tmp/p/zavodnye-koshmary.apk\n' "$(cat .github/bootstrap/zavodnye-koshmary.apk.sha256)" | sha256sum -c -
          printf '%s  /tmp/p/zavodnye-koshmary.apk\n' "c1a8f37ee1014588c374fd4cb98cfa2f86a425b7ad829f3c9193a37338e02b71" | sha256sum -c -
          ls -l /tmp/p

      - name: Create release v3.9.1 with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f /tmp/p/zavodnye-koshmary.apk || exit 0
          gh release view v3.9.1 >/dev/null 2>&1 && { printf 'release exists\n'; exit 0; }
          cat > /tmp/notes.md <<'NOTES'
          «Windup Wonderland» 3.9.1 — исправления игры по Wi‑Fi

          - **Выбор роли теперь соблюдается:** кто выбрал «Выживший», больше не становится аниматроником. Если аниматроника хотят больше игроков, чем есть мест, честный жребий решает это прямо в комнате, и все видят итог до старта.
          - **Выбор персонажа и скина соблюдается** (например, Джейсон-выживший). В комнате можно выбрать героя из своих открытых персонажей, у каждого игрока видно его роль и персонажа.
          - **Рейтинговые матчи по Wi‑Fi:** хост включает «Рейтинг» в комнате. Каждый игрок получает или теряет свои очки ранга по обычным правилам рейтинга, боты — по рангу хоста. Отказ от роли учитывается.
          - **Монеты пропуска честнее:** 10/15/20/25/30 по уровням, 30 на каждом 5-м уровне (во всех пропусках).

          Android 7.0+, versionCode 21 / versionName 3.9.1. Тот же ключ подписи: ставится поверх, сохранения не теряются.
          SHA-256: c1a8f37ee1014588c374fd4cb98cfa2f86a425b7ad829f3c9193a37338e02b71
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create v3.9.1 /tmp/p/zavodnye-koshmary.apk --target main --latest --title "Windup Wonderland v3.9.1" --notes-file /tmp/notes.md

      - name: Remove payload, sync gh-pages with main
        run: |
          set -euo pipefail
          test -f /tmp/p/zavodnye-koshmary.apk || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --ff-only origin main || true
          if [ -f .github/bootstrap/voice.tar.gz.b64 ]; then base64 -d .github/bootstrap/voice.tar.gz.b64 | tar xz; git add voice; fi
          git rm -q -r .github/bootstrap
          git rm -q -f --ignore-unmatch voice/a1_*.ogg voice/a2_*.ogg voice/k_*.ogg
          git commit -m "Remove v3.9.1 bootstrap payload (APK published in Release v3.9.1)"
          git push origin HEAD:main
          MAIN=$(git rev-parse HEAD)
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git merge --no-edit -X theirs "$MAIN" -m "Sync gh-pages with main (v3.9.1)"
          if ! git diff --quiet "$MAIN" HEAD; then git read-tree --reset -u "$MAIN" && git commit -m "Sync gh-pages tree with main"; fi
          git diff --quiet "$MAIN" HEAD
          git push origin gh-pages

      - name: Rebuild GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || printf 'Pages rebuild request not permitted; the push to gh-pages should trigger it.\n'
