name: Publish release (one-time bootstrap)

# The GitHub API tools used to maintain this repo can only upload text files,
# so the signed APK (built and signed locally) is uploaded as base64 into .github/bootstrap/
# (since v3.5 split into parts zavodnye-koshmary.apk.b64.partN; the .sha256 file is uploaded last).
# Since v3.8 the voice clips (voice/*.ogg) come as .github/bootstrap/voice.tar.gz.b64 and are committed to voice/ for the web version.
# This workflow decodes it, verifies SHA-256, creates the release with the APK,
# removes the payload and syncs gh-pages with main.
# It does NOT build or sign anything. v1.0 - v3.5 were published the same way.

on:
  push:
    branches: [main]
    paths: ['.github/bootstrap/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify payload
        run: |
          set -euo pipefail
          ls .github/bootstrap/zavodnye-koshmary.apk.b64.part* >/dev/null 2>&1 || { printf 'payload already processed\n'; exit 0; }
          test -f .github/bootstrap/zavodnye-koshmary.apk.sha256 || { printf 'checksum file not uploaded yet\n'; exit 0; }
          mkdir -p /tmp/p
          ls -l .github/bootstrap
          cat $(ls .github/bootstrap/zavodnye-koshmary.apk.b64.part* | sort -V) | base64 -d > /tmp/p/zavodnye-koshmary.apk
          printf '%s  /tmp/p/zavodnye-koshmary.apk\n' "$(cat .github/bootstrap/zavodnye-koshmary.apk.sha256)" | sha256sum -c -
          printf '%s  /tmp/p/zavodnye-koshmary.apk\n' "6ebb9b9d9f59993c8fbf970639efd55955754b92581107ceaadb39018a042ac9" | sha256sum -c -
          ls -l /tmp/p

      - name: Create release v4.0 with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f /tmp/p/zavodnye-koshmary.apk || exit 0
          gh release view v4.0 >/dev/null 2>&1 && { printf 'release exists\n'; exit 0; }
          cat > /tmp/notes.md <<'NOTES'
          «Windup Wonderland» 4.0 — Сезон 4 «Глубина»

          **Новое**
          - **Сезон 4 «Глубина»** (с 19 октября, 30 дней): новый пропуск. В бесплатной линии — аниматроник Утопленник, скин «Альтрон» для 001, рамки, жемчуг и звёздные семена. В «Золотой» — скин «Иллидан» для Рюка, баннеры и жемчуг. Награды Сезона 3, которые ты открыл, но не забрал, выдаются автоматически.
          - **Новая карта «Аквапарк»** (64×40) с настоящими бассейнами, горками и трубами-проходами. Есть в обычной ротации и в игре по Wi‑Fi.
          - **Новый аниматроник «Утопленник»** играется на всех картах:
            - «Нырок» переносит его из воды в другую воду ближе к выжившим;
            - «Водоворот» затягивает выживших;
            - «Долгий вдох» даёт +10% к скорости в воде;
            - выжившие оставляют мокрые следы, которые видит только он.
            В Аквапарке он ныряет через бассейны (и «Нырок» перезаряжается на 20% быстрее). На остальных картах в начале матча появляются 4 лужи, до которых можно дойти.
          - **Новый выживший «Артур Винслоу»**, основатель парка. «Ключ владельца» запирает дверь за ним на 8 с, «Железная рука» вырывает друга из рук аниматроника. Открывается за «Рейтинг парка 10» на «Территории» вместе с рамкой «Лучший парк».
          - **«Территория»**: твой собственный парк. Сажай звёздные семена на грядки, собирай урожай, ставь украшения и поднимай рейтинг парка.
          - **Жемчуг**, новая валюта: даётся за пропуск, рейтинговые победы, серию входов и промокоды. В «Лавке жемчуга» продаются рамки, значки и баннеры.
          - **Серия входов**: награда каждый день, на 7-й день — жемчуг и семена.
          - **Вкладка магазина «Глубина»**:
            - скин «Водный Джейсон» — 10000 монет, только в магазине;
            - наборы;
            - Лавка жемчуга.
          - **Мейнстоуны до 60 уровня**: у каждого персонажа один тематический скин, который меняется на каждом из 6 Мейнстоунов (свои частицы, свет и эффект поимки).
          - **Новые ранги**:
            - от «Посетителя» до «Кошмара» (0–999 RP);
            - «Легенда парка» (1000+ RP);
            - «Владелец парка» (1600+ RP).
            Твой RP переведён на новую шкалу: ранг остаётся прежним. В начале каждого сезона рейтинг мягко опускается на одну ступень, а за лучший ранг сезона дают значок.
          - **Топ-100** в профиле (таблица сезона на телефоне, без сервера).
          - Экран загрузки с советами. Анимированные портреты в «Персонажах» и на карточках «Ночной смены».
          - Эннард перерисован в человекоподобный облик. Скин «Марионетка» для Эхо (вдохновлено FNAF) получают в подарок все, кто прошёл «Сюжет».
          - 5 промокодов: GLUBINA, WINSLOW, ECHOFLASH, AQUAPARK, ZHEMCHUG.

          **Переработки**
          - **Майкл Майерс** стал чуть медленнее, общего выпада больше нет.
            - «???» — облик души до 20 с: невидим, проходит сквозь стены, может делать рывок. Если выйти из облика рядом с выжившим, тот получает «Испуг» (оглушение 5 с). Перезарядка 45 с.
            - «Схватить» — 6-секундный поединок, во время которого Майкла нельзя оглушить. Если выживший вырвался, Майкл бросает его; при попадании в другого выжившего оба замедлены на 30 с. Если победил Майкл: у стены выживший ранен и его нельзя унести, вдали от стены — задыхается за 10 с.
            - Во время «Выслеживания» Майкла нельзя оглушить.
          - **Джейсон**:
            - «Озеро» — прятаться в воде до 10 с;
            - «Затянуть» — оглушает аниматроника рядом на 2 с и отправляет его на сцену (перезарядка 60 с);
            - «Мачете» — замедляет и блокирует способности на 3 с, его нужно подобрать (перезарядка 40 с).

          **Исправления**
          - **Wi‑Fi:** после выигранного матча клиент больше не получает поражение и потерю рейтинга в следующем. Проверено 7 матчей подряд.
          - **Планшеты:** больше нет белого экрана и некликабельных кнопок. Проверены 1280×800, 1920×1200, 2560×1600 и 2048×1536 в обеих ориентациях.
          - Вернулись имена «Артур Винслоу», «Винслоу» и «Дом Винслоу».
          - Режим «Сюжет» убран: все его главы теперь можно прочитать в «Истории» вместе с новыми (ночной техник, спор на 200 долларов, молитва Максима, Утопленник, железная рука Артура, аквапарк, «Территория»). Записки на всех картах остались, в Аквапарке есть 6 новых. Собранные записки видны во вкладке «Записки».
          - Хэллоуин завершён: тыквы обменяны 1:1 на звёздные семена.
          - Включает все исправления 3.9.2: повторного сброса монет нет, потерянные монеты возвращаются.

          Неофициальная бесплатная фан-игра, без доната и рекламы. Весь арт нарисован кодом.
          Android 7.0+, versionCode 23 / versionName 4.0. Тот же ключ подписи: ставится поверх, сохранения не теряются.
          SHA-256: 6ebb9b9d9f59993c8fbf970639efd55955754b92581107ceaadb39018a042ac9
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create v4.0 /tmp/p/zavodnye-koshmary.apk --target main --latest --title "Windup Wonderland v4.0" --notes-file /tmp/notes.md

      - name: Remove payload, sync gh-pages with main
        run: |
          set -euo pipefail
          test -f /tmp/p/zavodnye-koshmary.apk || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --ff-only origin main || true
          if [ -f .github/bootstrap/voice.tar.gz.b64 ]; then base64 -d .github/bootstrap/voice.tar.gz.b64 | tar xz; git add voice; fi
          git rm -q -r .github/bootstrap
          git rm -q -f --ignore-unmatch voice/a1_*.ogg voice/a2_*.ogg voice/k_*.ogg
          git commit -m "Remove v4.0 bootstrap payload (APK published in Release v4.0)"
          git push origin HEAD:main
          MAIN=$(git rev-parse HEAD)
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git merge --no-edit -X theirs "$MAIN" -m "Sync gh-pages with main (v4.0)"
          if ! git diff --quiet "$MAIN" HEAD; then git read-tree --reset -u "$MAIN" && git commit -m "Sync gh-pages tree with main"; fi
          git diff --quiet "$MAIN" HEAD
          git push origin gh-pages

      - name: Rebuild GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || printf 'Pages rebuild request not permitted; the push to gh-pages should trigger it.\n'
