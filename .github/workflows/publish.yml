name: Publish release (one-time bootstrap)

# The GitHub API tools used to maintain this repo can only upload text files,
# so the signed APK (built and signed locally) is uploaded as base64 into .github/bootstrap/
# (since v3.5 split into parts zavodnye-koshmary.apk.b64.partN; the .sha256 file is uploaded last).
# Since v3.8 the voice clips (voice/*.ogg) come as .github/bootstrap/voice.tar.gz.b64 and are committed to voice/ for the web version.
# This workflow decodes it, verifies SHA-256, creates the release with the APK,
# removes the payload and syncs gh-pages with main.
# It does NOT build or sign anything. v1.0 - v3.5 were published the same way.

on:
  push:
    branches: [main]
    paths: ['.github/bootstrap/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify payload
        run: |
          set -euo pipefail
          ls .github/bootstrap/zavodnye-koshmary.apk.b64.part* >/dev/null 2>&1 || { printf 'payload already processed\n'; exit 0; }
          test -f .github/bootstrap/zavodnye-koshmary.apk.sha256 || { printf 'checksum file not uploaded yet\n'; exit 0; }
          mkdir -p /tmp/p
          ls -l .github/bootstrap
          cat $(ls .github/bootstrap/zavodnye-koshmary.apk.b64.part* | sort -V) | base64 -d > /tmp/p/zavodnye-koshmary.apk
          printf '%s  /tmp/p/zavodnye-koshmary.apk\n' "$(cat .github/bootstrap/zavodnye-koshmary.apk.sha256)" | sha256sum -c -
          printf '%s  /tmp/p/zavodnye-koshmary.apk\n' "279864bd3d4a38f5583b2b010384f8ac7adee08187c0f7cf6bd9c729353531c7" | sha256sum -c -
          ls -l /tmp/p

      - name: Create release v3.9 with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f /tmp/p/zavodnye-koshmary.apk || exit 0
          gh release view v3.9 >/dev/null 2>&1 && { printf 'release exists\n'; exit 0; }
          cat > /tmp/notes.md <<'NOTES'
          «Windup Wonderland» 3.9 — «Революция»

          - **Локальная игра по Wi‑Fi без интернета и серверов:** один телефон создаёт комнату, остальные в той же сети находят её в списке «Комнаты рядом» или входят по коду/IP. Роли, способности, ранения и спасения синхронизируются на всех картах, пустые места занимают боты. Если игрок отключился, его место занимает бот; если хост ушёл, матч корректно завершается.
          - **Друзья:** у каждого игрока свой ник и постоянный ID. Добавляй игроков в друзья в комнате или после матча (они принимают или отклоняют запрос), смотри, кто из друзей сейчас в сети, и приглашай их в свою комнату. Список хранится на телефоне, друзей можно удалять.
          - **«Революция» экономики:** награды пропуска 10–30 монет за уровень, монеты за матч уменьшены вдвое, персонажи стоят от 500, следующие пропуска будут стоить 5000. Купленные обычные персонажи вернулись в магазин (опыт, мастерство и скины остались). Пропускные, бесплатные, ивентовые и трибьют-персонажи (Джейсон, Крик, Майкл и другие) остаются у владельцев. Монеты свыше 2000 урезаны, а каждый игрок получает 100 монет и новый баннер «Олимп». Кто купил Ариму и получил её в пропуске, сначала получает возврат 1200.
          - **Кнопка «Купить уровень»** в пропуске: +1 уровень за 1000 монет.
          - **Уровни ботов по рангу:** Нуб, Нормальный, Профи или Бог. Чем выше ранг, тем быстрее реакция, точнее удары, умнее тактика и меньше ошибок.
          - Кампании, Кратос и Артас удалены.
          - Баннеры пропуска Сезона 3 теперь видны в профиле, и их можно надеть.
          - Убраны уведомление «Хэллоуин закончился, Крик бесплатно» и бонус +30 секунд выжившим. Боты больше не видят невидимого Фредди.
          - Исправлено наложение текста на маленьких экранах (568×320).

          Android 7.0+, versionCode 20 / versionName 3.9. Тот же ключ подписи: ставится поверх старой версии, сохранения не теряются. Новые разрешения нужны только для игры по локальной сети (Wi‑Fi).
          SHA-256: 279864bd3d4a38f5583b2b010384f8ac7adee08187c0f7cf6bd9c729353531c7
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create v3.9 /tmp/p/zavodnye-koshmary.apk --target main --latest --title "Windup Wonderland v3.9" --notes-file /tmp/notes.md

      - name: Remove payload, sync gh-pages with main
        run: |
          set -euo pipefail
          test -f /tmp/p/zavodnye-koshmary.apk || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --ff-only origin main || true
          if [ -f .github/bootstrap/voice.tar.gz.b64 ]; then base64 -d .github/bootstrap/voice.tar.gz.b64 | tar xz; git add voice; fi
          git rm -q -r .github/bootstrap
          git rm -q -f --ignore-unmatch voice/a1_*.ogg voice/a2_*.ogg voice/k_*.ogg
          git commit -m "Remove v3.9 bootstrap payload (APK published in Release v3.9)"
          git push origin HEAD:main
          MAIN=$(git rev-parse HEAD)
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git merge --no-edit -X theirs "$MAIN" -m "Sync gh-pages with main (v3.9)"
          if ! git diff --quiet "$MAIN" HEAD; then git read-tree --reset -u "$MAIN" && git commit -m "Sync gh-pages tree with main"; fi
          git diff --quiet "$MAIN" HEAD
          git push origin gh-pages

      - name: Rebuild GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || printf 'Pages rebuild request not permitted; the push to gh-pages should trigger it.\n'
