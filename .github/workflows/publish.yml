name: Publish release (one-time bootstrap)

# The GitHub API tools used to maintain this repo can only upload text files,
# so the signed APK (built and signed locally) is uploaded as base64 into .github/bootstrap/
# (since v3.5 split into parts zavodnye-koshmary.apk.b64.partN; the .sha256 file is uploaded last).
# This workflow decodes it, verifies SHA-256, creates the release with the APK,
# removes the payload and syncs gh-pages with main.
# It does NOT build or sign anything. v1.0 - v3.5 were published the same way.

on:
  push:
    branches: [main]
    paths: ['.github/bootstrap/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify payload
        run: |
          set -euo pipefail
          ls .github/bootstrap/zavodnye-koshmary.apk.b64.part* >/dev/null 2>&1 || { printf 'payload already processed\n'; exit 0; }
          test -f .github/bootstrap/zavodnye-koshmary.apk.sha256 || { printf 'checksum file not uploaded yet\n'; exit 0; }
          mkdir -p /tmp/p
          ls -l .github/bootstrap
          cat $(ls .github/bootstrap/zavodnye-koshmary.apk.b64.part* | sort -V) | base64 -d > /tmp/p/zavodnye-koshmary.apk
          printf '%s  /tmp/p/zavodnye-koshmary.apk\n' "$(cat .github/bootstrap/zavodnye-koshmary.apk.sha256)" | sha256sum -c -
          printf '%s  /tmp/p/zavodnye-koshmary.apk\n' "fe98d9f3032a3b1c7bb487836ae691f2da0b2983ec74828fd8d9a587b09e6480" | sha256sum -c -
          ls -l /tmp/p

      - name: Create release v3.6.1 with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f /tmp/p/zavodnye-koshmary.apk || exit 0
          gh release view v3.6.1 >/dev/null 2>&1 && { printf 'release exists\n'; exit 0; }
          cat > /tmp/notes.md <<'NOTES'
          «Windup Wonderland» 3.6.1 — исправления

          - **Пропуск:** вернулись задания и блок «Сезон 2» с таймером в конце пропуска (в 3.6 экран пропуска падал и не дорисовывался).
          - **Профиль:** баннер теперь подложка за именем и уровнем и не занимает место. Сетки «Рамки», «Значки», «Титулы», «Аватар», «Баннер» снова видны целиком.
          - **Персонажи:** карточки «Скоро» того же размера, что и обычные: тёмный силуэт и «?».
          - **Mikami Teru** больше не продаётся за монеты. Теперь он награда пропуска 2 сезона (бесплатная линия, уровень 48). Кто уже купил его в 3.6, оставляет его себе.

          Android 7.0+, versionCode 11 / versionName 3.6.1. Тот же ключ подписи: ставится поверх, сохранения не теряются.
          SHA-256: fe98d9f3032a3b1c7bb487836ae691f2da0b2983ec74828fd8d9a587b09e6480
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create v3.6.1 /tmp/p/zavodnye-koshmary.apk --target main --latest --title "Windup Wonderland v3.6.1" --notes-file /tmp/notes.md

      - name: Remove payload, sync gh-pages with main
        run: |
          set -euo pipefail
          test -f /tmp/p/zavodnye-koshmary.apk || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --ff-only origin main || true
          git rm -q -r .github/bootstrap
          git commit -m "Remove v3.6.1 bootstrap payload (APK published in Release v3.6.1)"
          git push origin HEAD:main
          MAIN=$(git rev-parse HEAD)
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git merge --no-edit -X theirs "$MAIN" -m "Sync gh-pages with main (v3.6.1)"
          if ! git diff --quiet "$MAIN" HEAD; then git read-tree --reset -u "$MAIN" && git commit -m "Sync gh-pages tree with main"; fi
          git diff --quiet "$MAIN" HEAD
          git push origin gh-pages

      - name: Rebuild GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || printf 'Pages rebuild request not permitted; the push to gh-pages should trigger it.\n'
