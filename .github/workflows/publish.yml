name: Publish release (one-time bootstrap)

# The GitHub API tools used to maintain this repo can only upload text files,
# so the signed APK (built and signed locally) is uploaded as base64 into .github/bootstrap/.
# This workflow decodes it, verifies SHA-256, creates the release with the APK,
# removes the payload and syncs gh-pages with main.
# It does NOT build or sign anything. v1.0 - v3.2 were published the same way.

on:
  push:
    branches: [main]
    paths: ['.github/bootstrap/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify payload
        run: |
          set -euo pipefail
          test -f .github/bootstrap/zavodnye-koshmary.apk.b64 || { printf 'payload already processed\n'; exit 0; }
          test -f .github/bootstrap/zavodnye-koshmary.apk.sha256 || { printf 'checksum file not uploaded yet\n'; exit 0; }
          mkdir -p /tmp/p
          base64 -d .github/bootstrap/zavodnye-koshmary.apk.b64 > /tmp/p/zavodnye-koshmary.apk
          printf '%s  /tmp/p/zavodnye-koshmary.apk\n' "$(cat .github/bootstrap/zavodnye-koshmary.apk.sha256)" | sha256sum -c -
          printf '%s  /tmp/p/zavodnye-koshmary.apk\n' "c045136ecd1129aa5ebc202e6985a911e4517d7c23447f88b17d9130aee555ac" | sha256sum -c -
          ls -l /tmp/p

      - name: Create release v3.2 with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f /tmp/p/zavodnye-koshmary.apk || exit 0
          gh release view v3.2 >/dev/null 2>&1 && { printf 'release exists\n'; exit 0; }
          cat > /tmp/notes.md <<'NOTES'
          «Windup Wonderland» 3.2

          - **Новый выживший — Father Maxim, «Священник»** (1000 монет, самый дорогой персонаж). Медленный, плохо прячется, выдерживает 3 удара.
            - **Крест** (60 с): 10 с установки, свет на всю комнату. Пока аниматроник в свете креста, светлые руки ловят его удары по любому выжившему. Крест можно сломать (5 прочности), одновременно стоит один.
            - **Молитва** (80 с): 8 с молитвы, затем лечит всех выживших, включая себя, и поднимает упавших. Пойманных на сцене и выбывших не возвращает.
            - **Святая вода** (40 с): +35% к скорости на 6 с.
          - Страница «Священник» в «Истории», эндоскелет «001» на карте «Парк».
          - Мастерство до 50 с Мейнстоунами, два скина в магазине, боты пользуются крестом, молитвой и святой водой, боты-аниматроники ломают крест.
          - Сохранения 3.1 и старше переносятся автоматически.

          Неофициальная бесплатная фан-игра. Без доната и рекламы, никаких покупок за настоящие деньги. Springtrap и Freddy взяты из Five Nights at Freddy's; все права на них принадлежат Скотту Коутону (Scott Cawthon). Игра не связана со Скоттом Коутоном и не одобрена им. Grimy — оригинальный персонаж автора игры; Freddy Fazbear's Pizza в её истории — отсылка к FNAF. Джейсон Вурхиз — персонаж фильмов Friday the 13th; все права принадлежат их правообладателям.

          Android 7.0+, пакет com.luntikvisuals.zavodnyekoshmary, versionCode 6 / versionName 3.2. Подписан тем же ключом, что и прошлые версии, ставится поверх.
          SHA-256: c045136ecd1129aa5ebc202e6985a911e4517d7c23447f88b17d9130aee555ac
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create v3.2 /tmp/p/zavodnye-koshmary.apk --target main --latest --title "Windup Wonderland v3.2" --notes-file /tmp/notes.md

      - name: Remove payload, sync gh-pages with main
        run: |
          set -euo pipefail
          test -f /tmp/p/zavodnye-koshmary.apk || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --ff-only origin main || true
          git rm -q -r .github/bootstrap
          git commit -m "Remove v3.2 bootstrap payload (APK published in Release v3.2)"
          git push origin HEAD:main
          MAIN=$(git rev-parse HEAD)
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git merge --no-edit -X theirs "$MAIN" -m "Sync gh-pages with main (v3.2)"
          if ! git diff --quiet "$MAIN" HEAD; then git read-tree --reset -u "$MAIN" && git commit -m "Sync gh-pages tree with main"; fi
          git diff --quiet "$MAIN" HEAD
          git push origin gh-pages

      - name: Rebuild GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || printf 'Pages rebuild request not permitted; the push to gh-pages should trigger it.\n'
