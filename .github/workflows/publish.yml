name: Publish release (one-time bootstrap)

# The GitHub API tools used to maintain this repo can only upload text files,
# so the signed APK (built and signed locally) is uploaded as base64 into .github/bootstrap/.
# This workflow decodes it, verifies SHA-256, creates the release with the APK,
# removes the payload and syncs gh-pages with main.
# It does NOT build or sign anything. v1.0 - v3.0 were published the same way.

on:
  push:
    branches: [main]
    paths: ['.github/bootstrap/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify payload
        run: |
          set -euo pipefail
          test -f .github/bootstrap/zavodnye-koshmary.apk.b64 || { printf 'payload already processed\n'; exit 0; }
          test -f .github/bootstrap/zavodnye-koshmary.apk.sha256 || { printf 'checksum file not uploaded yet\n'; exit 0; }
          mkdir -p /tmp/p
          base64 -d .github/bootstrap/zavodnye-koshmary.apk.b64 > /tmp/p/zavodnye-koshmary.apk
          printf '%s  /tmp/p/zavodnye-koshmary.apk\n' "$(cat .github/bootstrap/zavodnye-koshmary.apk.sha256)" | sha256sum -c -
          printf '%s  /tmp/p/zavodnye-koshmary.apk\n' "3c6cd577ba49976a2b2ef7f870522c21db944423359d339fab38954601165d0e" | sha256sum -c -
          ls -l /tmp/p

      - name: Create release v3.1 with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f /tmp/p/zavodnye-koshmary.apk || exit 0
          gh release view v3.1 >/dev/null 2>&1 && { printf 'release exists\n'; exit 0; }
          cat > /tmp/notes.md <<'NOTES'
          «Windup Wonderland» 3.1

          - **Новый режим «2 на 6»:** 2 аниматроника против 6 выживших (переключатель «Режим» в лобби, в «Обычном» и в «Рейтинге»). Сторона выпадает случайно: аниматроник с ботом-напарником или выживший с 5 ботами. 5 генераторов, 6 минут до рассвета, 50 с на сцене.
          - **Новые аниматроники:**
            - **Hippo** (550) — «Метание топора» и «Счастливый день»: шатёр с лабиринтом и маленькими бегемотиками. Пойманный в лабиринте выбывает без спасения.
            - **Котопес** (700) — пёс (глухой) и кошка (слепая) двумя телами: «Сменить», «Приказ» (за мной / охраняй / патруль) и «Соединение».
            - **Spinner** (650) — паутина на сцене (6 с снимать, сигнал Spinner), «Паутинный кокон» и паутины в дверных проёмах.
            - **Grimy** (600) — замедляющий грязный след, до 2 грязевых луж и нырок между ними.
            - **Dolly** (750) — «Шёпот» с ложного направления, «Игра в прятки» (счёт до 5) и кукольные домики с телепортом.
          - **Новые выжившие:** Rosa «Mop» Delgado (500) убирает ловушки в 4 раза быстрее и получает +5 монет за каждую; Cassidy (550) открывает портал в дальний конец карты на 10 с, и аниматроники тоже могут им пройти.
          - Мастерство до 50 и Мейнстоуны для всех новых персонажей, боты используют новые силы, новые страницы «Истории» и 5 новых записок (всего 15).
          - Сохранения 3.0 и старше переносятся автоматически.

          Неофициальная бесплатная фан-игра. Без доната и рекламы, никаких покупок за настоящие деньги. Springtrap и Freddy взяты из Five Nights at Freddy's; все права на них принадлежат Скотту Коутону (Scott Cawthon). Игра не связана со Скоттом Коутоном и не одобрена им. Grimy — оригинальный персонаж автора игры; Freddy Fazbear's Pizza в её истории — отсылка к FNAF. Джейсон Вурхиз — персонаж фильмов Friday the 13th; все права принадлежат их правообладателям.

          Android 7.0+, пакет com.luntikvisuals.zavodnyekoshmary, versionCode 5 / versionName 3.1. Подписан тем же ключом, что и прошлые версии, ставится поверх.
          SHA-256: 3c6cd577ba49976a2b2ef7f870522c21db944423359d339fab38954601165d0e
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create v3.1 /tmp/p/zavodnye-koshmary.apk --target main --latest --title "Windup Wonderland v3.1" --notes-file /tmp/notes.md

      - name: Remove payload, sync gh-pages with main
        run: |
          set -euo pipefail
          test -f /tmp/p/zavodnye-koshmary.apk || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --ff-only origin main || true
          git rm -q -r .github/bootstrap
          git commit -m "Remove v3.1 bootstrap payload (APK published in Release v3.1)"
          git push origin HEAD:main
          MAIN=$(git rev-parse HEAD)
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git merge --no-edit -X theirs "$MAIN" -m "Sync gh-pages with main (v3.1)"
          if ! git diff --quiet "$MAIN" HEAD; then git read-tree --reset -u "$MAIN" && git commit -m "Sync gh-pages tree with main"; fi
          git diff --quiet "$MAIN" HEAD
          git push origin gh-pages

      - name: Rebuild GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || printf 'Pages rebuild request not permitted; the push to gh-pages should trigger it.\n'
