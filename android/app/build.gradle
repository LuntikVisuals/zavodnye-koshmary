plugins { id 'com.android.application' }
def ksProps = new Properties()
def ksFile = file('/workspace/apk-keys/keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
android {
    namespace 'com.luntikvisuals.zavodnyekoshmary'
    compileSdk 34
    defaultConfig {
        applicationId 'com.luntikvisuals.zavodnyekoshmary'
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName '3.6.2'
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
