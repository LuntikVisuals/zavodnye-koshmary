name: Publish release (one-time bootstrap)

# The GitHub API tools used to maintain this repo can only upload text files,
# so the signed APK (built and signed locally) is uploaded as base64 into .github/bootstrap/
# (since v3.5 split into parts zavodnye-koshmary.apk.b64.partN; the .sha256 file is uploaded last).
# Since v3.8 the voice clips (voice/*.ogg) come as .github/bootstrap/voice.tar.gz.b64 and are committed to voice/ for the web version.
# This workflow decodes it, verifies SHA-256, creates the release with the APK,
# removes the payload and syncs gh-pages with main.
# It does NOT build or sign anything. v1.0 - v3.5 were published the same way.

on:
  push:
    branches: [main]
    paths: ['.github/bootstrap/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify payload
        run: |
          set -euo pipefail
          ls .github/bootstrap/zavodnye-koshmary.apk.b64.part* >/dev/null 2>&1 || { printf 'payload already processed\n'; exit 0; }
          test -f .github/bootstrap/zavodnye-koshmary.apk.sha256 || { printf 'checksum file not uploaded yet\n'; exit 0; }
          mkdir -p /tmp/p
          ls -l .github/bootstrap
          cat $(ls .github/bootstrap/zavodnye-koshmary.apk.b64.part* | sort -V) | base64 -d > /tmp/p/zavodnye-koshmary.apk
          printf '%s  /tmp/p/zavodnye-koshmary.apk\n' "$(cat .github/bootstrap/zavodnye-koshmary.apk.sha256)" | sha256sum -c -
          printf '%s  /tmp/p/zavodnye-koshmary.apk\n' "7ccea8359fb2c93a5debd5f867685a4e68e67850890199d2e92efc959124acff" | sha256sum -c -
          ls -l /tmp/p

      - name: Create release v4.0.1 with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f /tmp/p/zavodnye-koshmary.apk || exit 0
          gh release view v4.0.1 >/dev/null 2>&1 && { printf 'release exists\n'; exit 0; }
          cat > /tmp/notes.md <<'NOTES'
          «Windup Wonderland» 4.0.1

          **Новое**
          - **«Список обновлений» в Настройках:** все 24 версии игры, от 1.0 до 4.0.1, новые сверху. Каждую версию можно развернуть: номер, название, дата и изменения по разделам «Новое», «Переработки», «Исправления». Список прокручивается пальцем, закрывается кнопкой «Назад».
          - **Превью скина Мейнстоуна:** в «Персонажах» под шкалой мастерства видна следующая стадия тематического скина — рисунок, название, частицы, свет и эффект поимки. Можно листать все 6 стадий, закрытые отмечены 🔒.
          - **Старые скины Мейнстоунов снова в магазине** (вкладка «Мейнстоуны»): «Ржавый», «Неоновый», «Призрачный», «Золотой» и «Кошмарный» для 33 персонажей, по 80, 100, 120, 150 и 180 монет. Скин Мейнстоуна N можно купить только после того, как персонаж дошёл до Мейнстоуна N. До этого на скине написано «Нужен мейнстоун N».
          - **Компенсация:** если до 4.0 ты дошёл на персонаже до Мейнстоуна N, его старые скины 1…N выдаются бесплатно. Например, за Мейнстоун 4 на Джейсоне — скины I–IV. Выдаётся один раз, при запуске появится уведомление со списком.

          **Переработки**
          - **Экран загрузки нарисован заново:** ночной парк с колесом обозрения, каруселью, аркой с заводным ключом и глазами аниматроников в темноте. Полоска загрузки сделана в виде заводного ключа, советы сменяют друг друга.
          - **«Золотая» линия Сезона 4 стоит 3000 монет вместо 5000.** Кто уже купил её за 5000, один раз получает обратно 2000 монет и уведомление.
          - **Сложность Michael Myers теперь 4 звезды** (было 3).

          **Исправления**
          - **Планшеты:** игра больше не вылетает на экране загрузки. Экран рисуется с ограничением памяти, и запуск не ломается, если WebView сообщает размер 0×0 или экран поворачивается во время загрузки. Проверено на 4 размерах планшетов в обеих ориентациях при плотности пикселей 2–3.
          - **Телефоны:** экран загрузки больше не мелькает. Он показывается около 2,6 секунды, затем сам плавно переходит в меню. Экран не ждёт полной загрузки всех файлов страницы, поэтому на медленных планшетах он больше не висит до 9 секунд.
          - **Исправлена история Утопленника и ночного техника:** переписаны записи «Ночной техник», «Спор на 200 долларов», «Молитва Максима», «Утопленник» и «Железная рука Артура», записки аквапарка и описания Утопленника, Артура Винслоу и 001.

          Неофициальная бесплатная фан-игра, без доната и рекламы. Весь арт нарисован кодом.
          Android 7.0+, versionCode 24 / versionName 4.0.1. Тот же ключ подписи: ставится поверх, сохранения не теряются.
          SHA-256: 7ccea8359fb2c93a5debd5f867685a4e68e67850890199d2e92efc959124acff
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create v4.0.1 /tmp/p/zavodnye-koshmary.apk --target main --latest --title "Windup Wonderland v4.0.1" --notes-file /tmp/notes.md

      - name: Remove payload, sync gh-pages with main
        run: |
          set -euo pipefail
          test -f /tmp/p/zavodnye-koshmary.apk || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --ff-only origin main || true
          if [ -f .github/bootstrap/voice.tar.gz.b64 ]; then base64 -d .github/bootstrap/voice.tar.gz.b64 | tar xz; git add voice; fi
          git rm -q -r .github/bootstrap
          git rm -q -f --ignore-unmatch voice/a1_*.ogg voice/a2_*.ogg voice/k_*.ogg
          git commit -m "Remove v4.0.1 bootstrap payload (APK published in Release v4.0.1)"
          git push origin HEAD:main
          MAIN=$(git rev-parse HEAD)
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git merge --no-edit -X theirs "$MAIN" -m "Sync gh-pages with main (v4.0.1)"
          if ! git diff --quiet "$MAIN" HEAD; then git read-tree --reset -u "$MAIN" && git commit -m "Sync gh-pages tree with main"; fi
          git diff --quiet "$MAIN" HEAD
          git push origin gh-pages

      - name: Rebuild GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || printf 'Pages rebuild request not permitted; the push to gh-pages should trigger it.\n'
